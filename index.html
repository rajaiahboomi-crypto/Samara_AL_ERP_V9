<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#a40c59" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Samara Care" />
  <title>Samara Care ERP 2.3.1</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./icons/favicon.png" />
  <link rel="stylesheet" href="./styles.css?v=2.3.1" />
  <style>
    .app-splash-brand-logo{display:block;width:min(430px,82vw);max-height:210px;object-fit:contain;margin:0 auto 10px}
    @media(max-width:600px){.app-splash-brand-logo{width:min(320px,88vw);max-height:160px}}
  </style>
</head>
<body>
  <div id="app-splash" class="app-splash" role="status" aria-live="polite" aria-label="Loading Samara Care ERP">
    <div class="app-splash-orb app-splash-orb-one" aria-hidden="true"></div>
    <div class="app-splash-orb app-splash-orb-two" aria-hidden="true"></div>
    <div class="app-splash-card">
      <img class="app-splash-brand-logo" src="./assets/samara-logo.png?v=2.3.1" alt="Samara Assisted Living" />
      
      <h1>Samara Care ERP</h1>
      <p class="app-splash-tagline">Compassion&nbsp; • &nbsp;Comfort&nbsp; • &nbsp;Dignity</p>
      <div class="app-splash-progress" aria-hidden="true"><span></span></div>
      <p class="app-splash-status">Preparing your secure workspace…</p>
      <div class="app-splash-version">Version 2.3.1</div>
    </div>
  </div>
  <div id="root"></div>
  <noscript>JavaScript is required to run Samara Care.</noscript>
  <script src="./bootstrap-error.js?v=2.3.1"></script>
  <script src="./config.js?v=2.3.1"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="./health-check.js?v=2.3.1"></script>
  <script src="./app.js?v=2.3.1"></script>
</body>
</html>
